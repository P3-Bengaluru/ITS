# version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: its_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # only accessible inside LAN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U its_user -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    restart: unless-stopped
    env_file: ./server/.env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run seed && exec npm run dev"
    volumes:
      - ./server:/server
      - /server/node_modules
    develop:
      watch:
        - action: rebuild
          path: ./server
          target: /server
          ignore:
            - node_modules/
            - dist/
            - .env

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    develop:
      watch:
        - action: rebuild
          path: ./client
          target: /app
          ignore:
            - node_modules/
            - dist/


volumes:
  pg_data:
